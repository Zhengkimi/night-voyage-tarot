<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜航塔羅</title>
<meta name="description" content="Rider–Waite 體系完整 78 張塔羅牌線上抽牌與解讀，單一 HTML 檔、無後端、無圖片。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: one centered column — ritual flow from question → fan of 78 cards → spread board → reading. Single committed night palette. */
:root{
  color-scheme: dark;
  --night:#13152e;
  --panel:#1c1e40;
  --line:#383a68;
  --brass:#d1ab63;
  --brass-dim:#8a7245;
  --moon:#ece5d3;
  --muted:#a7a4c4;
  --parch:#f2e9d5;
  --ink:#2b2547;
  --rose:#e09a95;
  --back-a:#2c2b5e;
  --back-b:#181939;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Cormorant Garamond","Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--moon);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

/* Header */
header{padding-top:44px;display:grid;gap:10px;text-align:center;justify-items:center}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--brass);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,8vw,68px);line-height:1.1;margin:0;letter-spacing:.12em;text-wrap:balance}
h1 .num{font-family:var(--f-num);font-style:italic;font-weight:500;color:var(--brass);letter-spacing:0;font-size:.55em;vertical-align:.35em;margin-left:.2em}
.lede{margin:0;color:var(--muted);max-width:34em;text-wrap:balance}

/* Section label */
.step{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.step .n{font-family:var(--f-num);font-style:italic;font-size:26px;color:var(--brass);line-height:1}
.step h2{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0;letter-spacing:.06em}
.step .aside{margin-left:auto;font-size:13px;color:var(--muted)}

/* Controls */
.ritual{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.ritual > *{min-width:0}
@media (max-width:720px){.ritual{grid-template-columns:1fr;padding:18px}}
label.q{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.6}
textarea::placeholder{color:#76739a}
.tip{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.spreads{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;margin:0;padding:0}
.spreads legend{font-size:13px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;padding:0}
.spreads label{position:relative;display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--night);transition:border-color .2s}
.spreads input{position:absolute;opacity:0;pointer-events:none}
.spreads label:has(input:checked){border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.spreads label:has(input:focus-visible){outline:2px solid var(--brass);outline-offset:2px}
.spreads b{font-family:var(--f-display);font-weight:500;font-size:15px}
.spreads small{color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;color:var(--muted)}
.toggle input{accent-color:var(--brass);width:16px;height:16px}
.btn{border:1px solid var(--brass);background:transparent;color:var(--brass);padding:9px 18px;border-radius:999px;cursor:pointer;letter-spacing:.08em;font-size:14px;transition:background .2s,color .2s}
.btn:hover{background:var(--brass);color:var(--night)}
.btn.solid{background:var(--brass);color:var(--night)}
.btn.solid:hover{background:var(--moon);border-color:var(--moon)}

/* Fan */
.fan-wrap{position:relative}
#fan{position:relative;width:100%;margin:0 auto}
.fcard{position:absolute;padding:0;border-radius:6px;cursor:pointer;transform:rotate(var(--rot,0deg)) translateY(var(--lift,0px));
  transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .4s;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.fcard:hover,.fcard:focus-visible{--lift:-18px}
.fcard.taken{opacity:0;--lift:-70px;pointer-events:none}
.fan-wrap.done .fcard,.fan-wrap.busy .fcard{cursor:default;pointer-events:none}
.fan-wrap.done .fcard{filter:brightness(.55)}
#status{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 0;min-height:1.7em}
#status b{color:var(--brass);font-weight:500}

/* Card back */
.back{background:
   radial-gradient(circle at 50% 50%, var(--back-b) 0 21%, transparent 21.5%),
   radial-gradient(circle, var(--brass-dim) 0 0.8px, transparent 1.3px) 0 0/7px 7px,
   linear-gradient(160deg,var(--back-a),var(--back-b));
  border:1px solid var(--brass-dim);border-radius:6px;overflow:hidden}
.back::before{content:"";position:absolute;inset:7% 9%;border:1px solid var(--brass-dim);border-radius:3px}
.back::after{content:"";position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 68% 38%, var(--back-b) 0 44%, transparent 45%),radial-gradient(circle, var(--brass) 0 49%, transparent 50%)}

/* Board */
.board{display:grid;justify-content:center;align-items:start;justify-items:center;row-gap:14px;column-gap:calc(var(--cw)*.42);padding-block:8px}
.board.single{--cw:clamp(130px,40vw,190px)}
.board.three{--cw:clamp(86px,26vw,160px)}
.board.choice{--cw:clamp(74px,24vw,132px)}
.board.celtic{--cw:clamp(52px,15vw,104px)}
.board{--ch:calc(var(--cw)*1.6)}
.slot{width:var(--cw);display:grid;gap:6px;justify-items:center;position:relative}
.slot .place{width:var(--cw);height:var(--ch);border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;
  font-family:var(--f-num);font-style:italic;color:var(--line);font-size:calc(var(--cw)*.3);position:relative}
.slot .lab{font-size:12px;color:var(--muted);text-align:center;line-height:1.35;letter-spacing:.04em;min-height:1.35em}
.slot .lab i{font-family:var(--f-num);color:var(--brass);font-size:14px;margin-right:2px}
.slot.cross{z-index:2;transform:rotate(90deg);transform-origin:50% calc(var(--ch)/2)}
.slot.cross .lab{visibility:hidden}
.slot.next .place{border-color:var(--brass);color:var(--brass)}

.card{position:absolute;inset:0;perspective:900px;cursor:pointer;animation:land .5s cubic-bezier(.2,.7,.2,1)}
@keyframes land{from{transform:translateY(-40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.6,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.card .front{transform:rotateY(180deg);background:var(--parch);overflow:hidden}
.card .front svg{display:block;width:100%;height:100%}
.card.rev .front svg{transform:rotate(180deg)}
.card:not(.flipped):hover .inner{transform:translateY(-4px)}
.card.flipped.hl .face{box-shadow:0 0 0 2px var(--brass),0 4px 18px rgba(209,171,99,.4)}

.board-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}

/* Reading */
#reading{display:grid;gap:18px}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:grid;gap:8px;scroll-margin-top:24px}
.summary h3{font-family:var(--f-display);font-weight:500;margin:0;font-size:18px;letter-spacing:.06em;color:var(--brass)}
.summary .question{margin:0;font-family:var(--f-display);font-size:17px}
.summary p{margin:0;max-width:62ch}
.entries{display:grid;gap:14px}
.entry{display:grid;grid-template-columns:88px 1fr;gap:18px;padding:18px;border-top:1px solid var(--line);scroll-margin-top:24px;animation:rise .5s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.summary .progress{color:var(--muted);font-size:14px}
.summary .line{animation:rise .5s ease both}
.entry > *{min-width:0}
.entry .thumb{width:88px;aspect-ratio:10/16;border-radius:5px;overflow:hidden;background:var(--parch);max-width:100%}
.entry .thumb svg{width:100%;height:100%;display:block}
.entry .thumb.rev svg{transform:rotate(180deg)}
.entry .pos{font-size:12px;letter-spacing:.14em;color:var(--brass)}
.entry h4{font-family:var(--f-display);font-weight:700;font-size:21px;margin:2px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.orient{font-family:var(--f-body);font-weight:500;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid currentColor;letter-spacing:.08em}
.orient.up{color:var(--brass)}
.orient.rv{color:var(--rose)}
.entry .en{font-family:var(--f-num);font-style:italic;color:var(--muted);font-size:16px;margin:0}
.kw{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:8px 0}
.kw li{font-size:13px;padding:2px 10px;border-radius:4px;background:rgba(209,171,99,.12);color:var(--moon)}
.entry .hint{font-size:13px;color:var(--muted);margin:0 0 4px}
.entry p.text{margin:0;max-width:62ch}
@media (max-width:520px){.entry{grid-template-columns:64px 1fr;gap:14px;padding:14px 0}.entry .thumb{width:64px}}
.reading-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
#copied{font-size:13px;color:var(--brass);align-self:center}
#copyFallback{margin-top:12px;min-height:180px}

footer{text-align:center;color:#6f6c92;font-size:12px;letter-spacing:.06em}

@media (prefers-reduced-motion: reduce){
  .fcard,.card .inner{transition:none}
  .card,.entry,.summary .line{animation:none}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="eyebrow">Rider–Waite 體系 · 完整 78 張牌</div>
    <h1>夜航塔羅<span class="num">lxxviii</span></h1>
    <p class="lede">靜下心，默想你的問題。選好牌陣後，從扇形牌堆中憑直覺抽牌，再一張張翻開，閱讀牌面給你的訊息。</p>
  </header>

  <section aria-labelledby="s1">
    <div class="step"><span class="n">i</span><h2 id="s1">設定占卜</h2></div>
    <div class="ritual">
      <div>
        <label class="q" for="question">你想詢問的問題（可留空）</label>
        <textarea id="question" maxlength="200" placeholder="例如：接下來三個月，我在工作上需要注意什麼？">接下來三個月，我在工作上需要注意什麼？</textarea>
        <p class="tip">用開放式、聚焦在自己的問法，例如「我能怎麼做」，會比是非題得到更有用的解讀。</p>
        <div class="row">
          <label class="toggle"><input type="checkbox" id="reversals" checked> 包含逆位牌</label>
        </div>
      </div>
      <fieldset class="spreads" id="spreads">
        <legend>牌陣</legend>
        <label><input type="radio" name="spread" value="single" id="sp-single"><b>今日指引</b><small>1 張 · 單一訊息</small></label>
        <label><input type="radio" name="spread" value="three" id="sp-three" checked><b>時間之流</b><small>3 張 · 過去 現在 未來</small></label>
        <label><input type="radio" name="spread" value="choice" id="sp-choice"><b>二選一</b><small>5 張 · 比較兩條路</small></label>
        <label><input type="radio" name="spread" value="celtic" id="sp-celtic"><b>凱爾特十字</b><small>10 張 · 全面剖析</small></label>
      </fieldset>
    </div>
  </section>

  <section aria-labelledby="s2">
    <div class="step"><span class="n">ii</span><h2 id="s2">洗牌與抽牌</h2><button class="btn aside" id="shuffle" type="button">重新洗牌</button></div>
    <div class="fan-wrap" id="fanWrap">
      <div id="fan" role="group" aria-label="牌堆"></div>
      <p id="status" aria-live="polite"></p>
    </div>
  </section>

  <section aria-labelledby="s3">
    <div class="step"><span class="n">iii</span><h2 id="s3">牌陣</h2><span class="aside" id="spreadName"></span></div>
    <div class="board" id="board"></div>
    <div class="board-actions">
      <button class="btn solid" id="revealAll" type="button" hidden>全部翻開</button>
    </div>
  </section>

  <section aria-labelledby="s4" id="readingSec" hidden>
    <div class="step"><span class="n">iv</span><h2 id="s4">解讀</h2></div>
    <div id="reading"></div>
    <div class="reading-actions" id="readingActions" hidden>
      <button class="btn" id="copy" type="button">複製解讀文字</button>
      <button class="btn solid" id="again" type="button">重新占卜</button>
      <span id="copied" aria-live="polite"></span>
    </div>
    <textarea id="copyFallback" hidden readonly aria-label="解讀文字"></textarea>
  </section>

  <footer>塔羅是自我覺察的鏡子，不是命定的判決。牌義供參考，最終的選擇在你手中。<br>健康、法律、財務與心理危機等重大問題，請諮詢專業人士。</footer>
</div>

<!--
  核心層（資料 + 渲染 + 純邏輯），不碰 DOM。
  掛在 globalThis.Tarot，供下方介面層與 tests/ 的自動測試共用。
-->
<script id="tarot-core">
(function(root){
"use strict";

/* ---------- 資料層：大阿爾克那 ----------
   [中文名, 英文名, 正位關鍵字, 逆位關鍵字, 正位建議, 逆位建議] */
const MAJORS = [
 ["愚者","The Fool","新的開始、自由、冒險、純真","魯莽、輕率、冒不必要的險","帶著好奇心跨出第一步，不必等到一切準備完美。","衝動之前先看清腳下，冒險也需要基本的準備。"],
 ["魔術師","The Magician","創造力、行動、資源齊備","操控、才能未發揮、欺騙","你已擁有所需的資源，現在是把想法化為行動的時刻。","檢視自己是否分散心力，也留意有人言過其實。"],
 ["女祭司","The High Priestess","直覺、潛意識、神秘","忽略直覺、秘密、隱藏的議題","安靜下來聆聽內在的聲音，答案不在外界。","你可能刻意忽略了某種直覺，或有尚未說出口的事。"],
 ["皇后","The Empress","豐盛、滋養、創造、母性","依賴、創意受阻、過度保護","允許自己享受與付出，被滋養的事物會自然成長。","照顧別人之前，先把能量還給自己。"],
 ["皇帝","The Emperor","權威、結構、秩序","控制欲、僵化、缺乏紀律","建立規則與結構，以穩定的態度掌握局面。","控制得太緊反而失去支持，試著保留彈性。"],
 ["教皇","The Hierophant","傳統、信仰、指引","打破常規、叛逆、質疑權威","向經驗豐富的人或既有體制尋求指引。","舊規則已不適用，你可以走出屬於自己的路。"],
 ["戀人","The Lovers","愛、和諧、價值選擇","失衡、價值衝突、錯誤選擇","依照內心真正重視的價值做出選擇。","關係或抉擇出現失衡，坦誠面對自己的需要。"],
 ["戰車","The Chariot","意志、勝利、掌控方向","失控、方向不明、挫敗","集中意志、握緊方向，持續前進就能贏得局面。","先停下來確認方向，別讓各方拉扯耗盡力氣。"],
 ["力量","Strength","勇氣、耐心、溫柔的力量","自我懷疑、軟弱、情緒失控","以溫柔與耐心面對困難，比硬碰硬更有力量。","你比自己以為的更堅強，別讓懷疑掌控情緒。"],
 ["隱者","The Hermit","內省、獨處、尋找真理","孤立、逃避、迷失","給自己一段獨處的時間，向內尋找答案。","獨處過久可能變成孤立，試著重新與人連結。"],
 ["命運之輪","Wheel of Fortune","轉機、循環、命運","厄運、抗拒改變、失控","局勢正在轉動，順勢把握出現的機會。","低潮也是循環的一部分，接受變化才能翻轉。"],
 ["正義","Justice","公平、真相、因果","不公、逃避責任、偏見","誠實面對事實，你的選擇會帶來相應的結果。","留意不公平的對待，也檢視自己是否逃避責任。"],
 ["吊人","The Hanged Man","暫停、換個角度、臣服","拖延、無謂的犧牲、停滯","暫時停下腳步，換一個角度看，局面就會不同。","無止境的等待並不是臣服，是時候做決定了。"],
 ["死神","Death","結束、轉化、新生","抗拒改變、停滯、無法放手","讓該結束的結束，空出位置給新的開始。","緊抓不放只會延長痛苦，試著鬆開手。"],
 ["節制","Temperance","平衡、調和、耐心","失衡、過度、急躁","在兩端之間找到中庸，慢慢調和就會順利。","生活某處過度了，回到適合自己的節奏。"],
 ["惡魔","The Devil","束縛、慾望、執著","解脫、覺醒、打破枷鎖","看清是什麼在束縛你，覺察本身就是鬆綁的開始。","你正逐步掙脫舊有的依附，請持續下去。"],
 ["高塔","The Tower","劇變、崩解、真相揭露","逃過一劫、延遲的危機、害怕改變","突來的變動會拆掉不穩固的基礎，讓真相浮現。","你也許暫時避開了衝擊，但根本問題仍需處理。"],
 ["星星","The Star","希望、療癒、靈感","失望、失去信心、沮喪","保持希望，療癒正在發生，未來值得期待。","暫時失去信心沒關係，從小事重新點亮希望。"],
 ["月亮","The Moon","幻象、不安、潛意識","釋放恐懼、真相大白、走出迷惘","事情未明朗前別急著下結論，留意恐懼造成的錯覺。","迷霧正在散去，你會逐漸看清真相。"],

/* 點數牌：依點數排列花色符號（座標以 100×160 牌面為準） */
const PIPS = {
 1:[[50,74]],2:[[50,45],[50,103]],3:[[50,40],[50,74],[50,108]],4:[[32,45],[68,45],[32,103],[68,103]],

function faceSVG(c){

      <g class="star" transform="translate(18 34) scale(.45)"><polygon points="${STAR5}" fill="${col}"/></g><g class="star" transform="translate(82 114) scale(.45)"><polygon points="${STAR5}" fill="${col}"/></g>`;
  } else if(c.r<10){

/* ---------- 資料層：牌陣 ----------
   l 位置名稱、h 位置意義、c/r 格線欄列（從 1 起算）、x 是否橫放 */
const SPREADS = {
  single:{name:"今日指引",cols:1,rows:1,pos:[{l:"指引",h:"此刻你最需要知道的訊息",c:1,r:1}]},
  three:{name:"時間之流",cols:3,rows:1,pos:[{l:"過去",h:"影響現況的根源與經驗",c:1,r:1},{l:"現在",h:"你目前所處的狀態",c:2,r:1},{l:"未來",h:"依照現有方向的可能發展",c:3,r:1}]},
  choice:{name:"二選一",cols:3,rows:3,pos:[
    {l:"現況",h:"你此刻面對抉擇時的心境",c:2,r:3},

    {l:"選擇 B 的過程",h:"走上 B 路時會經歷的事",c:3,r:2},{l:"選擇 B 的結果",h:"B 路最可能帶來的結果",c:3,r:1}]},
  celtic:{name:"凱爾特十字",cols:4,rows:4,pos:[
    {l:"現況",h:"問題的核心與目前處境",c:2,r:2},{l:"阻礙",h:"橫在你面前的挑戰",c:2,r:2,x:true},
    {l:"根基",h:"潛意識與事情的根源",c:2,r:3},{l:"過去",h:"正在離去的影響",c:1,r:2},
    {l:"目標",h:"你意識上的期望與可能的最好結果",c:2,r:1},{l:"近未來",h:"即將發生的事",c:3,r:2},
    {l:"自我",h:"你面對這件事的態度",c:4,r:4},{l:"環境",h:"周遭的人與外在影響",c:4,r:3},
    {l:"希望與恐懼",h:"內心期待或擔憂的事",c:4,r:2},{l:"結果",h:"綜合以上的最終走向",c:4,r:1}]}
};

/* ---------- 洗牌 ----------
   randInt：crypto.getRandomValues + 拒絕取樣，消除取餘數造成的微小偏差
   shuffle：Fisher–Yates，每種牌序機率相等；正逆位各 50% */
function randInt(n){
  const c=root.crypto;
  if(c&&c.getRandomValues){
    const lim=Math.floor(0x100000000/n)*n, a=new Uint32Array(1);
    do{c.getRandomValues(a)}while(a[0]>=lim);
    return a[0]%n;
  }
  return Math.floor(Math.random()*n);
}
function shuffle(reversals,rnd=randInt){
  const a=CARDS.map((_,i)=>i);
  for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}
  return a.map(i=>({i,rev:!!reversals&&rnd(2)===1}));
}

/* ---------- 解讀 ---------- */
function interp(c,rev){return rev?c.rvT:c.upT}

/* 依規則分析整個牌陣：大牌比例、主導花色、重複數字、宮廷牌、逆位數量
   picks：[{i,rev}]；reversals：本次是否啟用逆位（關閉時不評論正逆位） */
function summaryLines(picks,reversals=true){
  const n=picks.length, cards=picks.map(p=>CARDS[p.i]);
  const majors=cards.filter(c=>c.major).length, revs=picks.filter(p=>p.rev).length;
  const lines=[];
  if(n===0) return lines;
  if(n===1){
    const c=cards[0], r=picks[0].rev;
    lines.push(c.major?"抽到大阿爾克那，代表這是此刻較深層、值得認真面對的人生課題。":`這張牌屬於${c.suit.zh}（${c.suit.el}元素），提醒你今天聚焦於${c.suit.domain}。`);
    if(reversals) lines.push(r?"牌以逆位出現，能量正在受阻或需要向內整理，放慢腳步會更好。":"牌以正位出現，能量順暢，可以順著它的建議行動。");
    return lines;
  }
  if(majors/n>=0.5) lines.push(`${n} 張牌中有 ${majors} 張大阿爾克那。這件事牽涉重要的人生課題，外在的大趨勢影響較深，順勢而為比強求更重要。`);
  else if(majors===0) lines.push("牌陣全由小阿爾克那組成。事情多落在日常層面，你能透過具體行動直接調整走向。");
  else lines.push(`牌陣以小阿爾克那為主（大阿爾克那 ${majors} 張）。多數狀況可以靠自己的行動改變，大牌所在的位置則是需要特別留意的關鍵。`);

  const cnt={};cards.forEach(c=>{if(!c.major)cnt[c.suit.key]=(cnt[c.suit.key]||0)+1});
  const ent=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  if(ent.length&&ent[0][1]>=2&&(ent.length===1||ent[0][1]>ent[1][1])){
    const s=SUITS.find(x=>x.key===ent[0][0]);
    lines.push(`${s.zh}牌出現 ${ent[0][1]} 張，${s.el}元素最強，重心落在${s.domain}。`);
  }

  const rk={};cards.forEach(c=>{if(!c.major&&c.r<10)rk[c.r]=(rk[c.r]||0)+1});
  Object.entries(rk).filter(([,v])=>v>=2).sort((a,b)=>b[1]-a[1]||a[0]-b[0])
    .forEach(([r,v])=>lines.push(`出現 ${v} 張「${RANK_ZH[r]}」，數字主題「${RANK_THEME[r]}」在這次占卜中被特別強調。`));

  const courts=cards.filter(c=>!c.major&&c.r>=10).length;
  if(courts>=2) lines.push(`宮廷牌有 ${courts} 張，它們可能代表參與其中的人，也可能是你需要展現的特質。`);

  if(reversals){
    if(revs===0) lines.push("全部皆為正位，能量流動順暢，是適合積極推進的時機。");
    else if(revs/n>0.5) lines.push(`逆位有 ${revs} 張，超過半數。能量受阻或轉向內在，宜先整理想法與情緒，再決定下一步。`);
    else lines.push(`逆位 ${revs} 張，提示其中有幾個環節需要調整或重新檢視。`);
  }
  return lines;
}

function readingText(spreadKey,question,picks,reversals=true){
  const sp=SPREADS[spreadKey], q=(question||"").trim();
  let t=`【夜航塔羅｜${sp.name}】\n`;

  t+="\n"+summaryLines(picks,reversals).join("\n")+"\n";
  picks.forEach((d,i)=>{const c=CARDS[d.i];t+=`\n${i+1}. ${sp.pos[i].l}：${c.zh}（${d.rev?"逆位":"正位"}）\n   關鍵字：${d.rev?c.rv:c.up}\n   ${interp(c,d.rev)}\n`});
  return t;
}

root.Tarot = {MAJORS,SUITS,CARDS,SPREADS,RANK_ZH,RANK_EN,RANK_THEME,roman,faceSVG,randInt,shuffle,interp,summaryLines,readingText};
})(globalThis);

<!-- 介面層：狀態與互動 -->
<script id="tarot-ui">
(function(){
"use strict";
const {CARDS,SPREADS,roman,faceSVG,randInt,shuffle,interp,summaryLines,readingText} = Tarot;
const $=s=>document.querySelector(s);
const fan=$("#fan"), board=$("#board"), statusEl=$("#status"), fanWrap=$("#fanWrap");
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const scrollTo=el=>el.scrollIntoView({behavior:reduceMotion()?"auto":"smooth",block:"start"});

/* 狀態：spreadKey、deck、picks、flippedN（另有 revMode 記錄本副牌是否含逆位） */
let spreadKey="three", deck=[], picks=[], slots=[], flippedN=0, revMode=true;
/* gen：每次重置遞增，讓排程中的翻牌／解讀在重置後失效；busy：洗牌動畫中暫停抽牌 */
let gen=0, busy=false;

function newDeck(){revMode=$("#reversals").checked;deck=shuffle(revMode)}

/* ---------- 扇形牌堆：78 張繞著畫面下方一個看不見的圓心旋轉 ---------- */
let fanEls=[];
function buildFan(){
  fan.innerHTML="";fanEls=[];
  deck.forEach((d,k)=>{
    const el=document.createElement("button");
    el.type="button";el.className="fcard back";el.setAttribute("aria-label","抽第 "+(k+1)+" 張牌");
    el.addEventListener("click",()=>pick(k,el));
    fan.appendChild(el);fanEls.push(el);
  });
  layoutFan(false);
}
function layoutFan(gather){
  const W=fan.clientWidth||320, n=fanEls.length;
  const fw=W<520?44:W<800?54:62, fh=fw*1.6;
  const half=(W>700?42:50)*Math.PI/180;
  let R=(W/2-fw/2-6)/Math.sin(half); R=Math.min(R,560);
  const top=26;
  fan.style.height=(top+fh+R*(1-Math.cos(half))+fw*0.8)+"px";
  fanEls.forEach((el,k)=>{
    const t=n>1?(-half+2*half*k/(n-1)):0;
    el.style.width=fw+"px";el.style.height=fh+"px";
    el.style.left=(W/2-fw/2)+"px";el.style.top=top+"px";
    el.style.transformOrigin=`50% ${fh/2+R}px`;
    el.style.transitionDelay=gather?"0ms":(k*6)+"ms";
    el.style.setProperty("--rot",gather?((k%5)-2)*0.6+"deg":(t*180/Math.PI).toFixed(2)+"deg");
  });

let resizeT;
window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{fanEls.forEach(e=>e.style.transitionDelay="0ms");layoutFan(false);drawSky()},120)});

/* 洗牌：先收攏，再換新牌序依序展開 */

    if(g!==gen) return;

      busy=false;fanWrap.classList.remove("busy");

    }));
  },500);
}

/* ---------- 牌陣面板 ---------- */
function buildBoard(){
  const sp=SPREADS[spreadKey];

function setStatus(h){statusEl.innerHTML=h}

/* ---------- 解讀：翻一張就顯示該張的解讀，全部翻開後補上整體訊息 ---------- */

function addEntry(i){

  const a=document.createElement("article");a.className="entry";a.id="entry-"+i;a.dataset.i=i;

    <div><div class="pos">位置 ${i+1} · ${pos.l}</div>
    <h4>${c.zh}<span class="orient ${d.rev?"rv":"up"}">${d.rev?"逆位":"正位"}</span></h4>
    <p class="en">${c.en} · ${c.major?"大阿爾克那 "+roman(c.n):c.suit.zh+"（"+c.suit.el+"元素）"}</p>
    <ul class="kw">${(d.rev?c.rv:c.up).split("、").map(k=>`<li>${k}</li>`).join("")}</ul>
    <p class="hint">此位置代表：${pos.h}</p>

}
function finishReading(){
  const sum=$("#reading .summary");

  if(picks.length===0&&!busy){revMode=$("#reversals").checked;deck.forEach(d=>d.rev=revMode&&randInt(2)===1)}
});
$("#revealAll").addEventListener("click",()=>{const g=gen;picks.forEach((_,i)=>setTimeout(()=>{if(g===gen)flip(i)},i*220))});
$("#copy").addEventListener("click",()=>{
  const t=readingText(spreadKey,$("#question").value,picks,revMode);
  const ok=()=>{$("#copied").textContent="已複製"};
  try{navigator.clipboard.writeText(t).then(ok,()=>fallback(t))}catch(e){fallback(t)}
});
function fallback(t){const ta=$("#copyFallback");ta.hidden=false;ta.value=t;ta.select();$("#copied").textContent="請手動複製下方文字"}

/* ---------- 星空 ---------- */
const sky=$("#sky");
function drawSky(){
  const dpr=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
  sky.width=w*dpr;sky.height=h*dpr;const g=sky.getContext("2d");if(!g)return;g.scale(dpr,dpr);
  const grd=g.createRadialGradient(w*.5,-h*.1,0,w*.5,-h*.1,h*1.1);grd.addColorStop(0,"rgba(90,70,150,.35)");grd.addColorStop(1,"rgba(19,21,46,0)");
  g.fillStyle=grd;g.fillRect(0,0,w,h);
  let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=Math.round(w*h/5000);
  for(let i=0;i<n;i++){const x=r()*w,y=r()*h,s=r()*1.2+.2;g.globalAlpha=r()*.6+.15;g.fillStyle=r()<.15?"#d1ab63":"#ece5d3";g.beginPath();g.arc(x,y,s,0,Math.PI*2);g.fill()}
  g.globalAlpha=1;
}

/* 測試用唯讀窺視（tests/e2e.html 使用），不影響功能 */
globalThis.TarotUI={get state(){return {spreadKey,deck:deck.slice(),picks:picks.slice(),flippedN,revMode,busy}}};

drawSky();
newDeck();buildBoard();buildFan();updateStatus();
})();
